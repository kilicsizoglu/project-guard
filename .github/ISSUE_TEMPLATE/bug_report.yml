name: "🐛 Bug Report"
description: "Report a reproducible bug, false positive, or detection failure"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to Project Guard! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: "Project Guard Version"
      description: "Run `project-guard --version` and paste the output here."
      placeholder: "v1.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Which Windows version are you using?"
      options:
        - "Windows 11 (23H2 / 24H2)"
        - "Windows 10 (22H2)"
        - "Windows Server 2022 / 2019"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of the bug or false positive."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce the problem?"
      placeholder: |
        1. Run `project-guard scan <target>`
        2. Observe error output...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Logs or Terminal Output"
      description: "Paste relevant output or service logs (`.project_guard/service.log`)."
      render: shell
