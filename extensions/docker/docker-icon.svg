  <!-- Container Box Blocks inside Shield -->
  <rect x="52" y="52" width="10" height="10" rx="1.5" fill="#38BDF8" />
  <rect x="66" y="52" width="10" height="10" rx="1.5" fill="#38BDF8" />
  <rect x="52" y="66" width="10" height="10" rx="1.5" fill="#10B981" />
  <rect x="66" y="66" width="10" height="10" rx="1.5" fill="#10B981" />
  <rect x="59" y="38" width="10" height="10" rx="1.5" fill="#38BDF8" />
</svg>
